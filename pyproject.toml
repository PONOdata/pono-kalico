[project]
name = "Kalico"
version = "0.12.1"
requires-python = ">=3.10"
dependencies = [
  "cffi==1.17.1 ; python_version >= '3.13'",
  "cffi==1.15.1 ; python_version < '3.13'",
  "greenlet==3.3 ; python_version >= '3.14'",
  "greenlet==3.1 ; python_version == '3.13'",
  "greenlet==3.0.3 ; python_version == '3.12'",
  "greenlet==2.0.2 ; python_version < '3.12'",
  "Jinja2>=3.1.6",
  "markupsafe==2.1.5",
  "numpy~=2.2 ; python_version>='3.10'",
  "pyserial==3.4",
  "python-can~=4.5",
  "setuptools==84.2.1 ; python_version >= '3.12'", # required by python-can < 4.3
]

[dependency-groups]
dev = [
  # Capped below 0.16: ruff 0.16.0 greatly expanded its default lint rule set
  # (UP/LOG/SIM/BLE/TRY/S families), taking `ruff check .` here from 2 errors to
  # 2222. ruff-action installs the newest version satisfying this specifier, so
  # the cap is what keeps CI on 0.15.x. Raise deliberately, not incidentally.
  "ruff>=0.9.3,<0.16",
  # Not on Python 3.10: pre-commit pulls virtualenv, which needs filelock>=3.24.2
  # there, and every filelock that runs on 3.10 sits inside GHSA-v4x8-3wr5-3wq8
  # (fixed in 4.2.1, which needs 3.11). The CI test jobs use pytest only.
  "pre-commit>=4.0.1 ; python_full_version != '3.10.*'",
  "pytest-xdist>=3.6.1",
  # 9.0.3 is the floor for the tmpdir fix, GHSA-6w46-j5rx-g56g.
  "pytest>=9.0.3",
]

[project.urls]
homepage = "https://kalico.gg/"
source = "https://github.com/KalicoCrew/kalico"
documentation = "https://docs.kalico.gg/"
issues = "https://github.com/KalicoCrew/kalico/issues"
funding = "https://docs.kalico.gg/Sponsors.html"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
